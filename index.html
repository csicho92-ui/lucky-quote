<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>칠라씨의 비밀 편지 🍀</title>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #d4eaaf;
      --bg2: #e8f5c8;
      --green: #4a9e4a;
      --dark-green: #2d6b2d;
      --yellow: #f5d020;
      --pink: #f472b6;
      --cream: #fdfaf0;
      --brown: #8b6340;
      --ink: #2a2018;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #050d1a;
      font-family: 'Noto Sans KR', sans-serif;
      overflow-x: hidden;
    }

    /* ── 밤하늘 배경 ── */
    .bg-texture {
      position: fixed; inset: 0; z-index: 0;
      background: linear-gradient(170deg,
        #0a1628 0%,
        #0d2244 25%,
        #0a1a3a 50%,
        #060e1f 80%,
        #020608 100%
      );
    }

    /* 픽셀 별 */
    .night-star {
      position: fixed;
      background: white;
      border-radius: 0;
      animation: starBlink var(--d,2s) step-end infinite var(--dl,0s);
      z-index: 1;
    }
    @keyframes starBlink { 0%,100%{opacity:1;} 50%{opacity:0.05;} }

    /* ── 배경 손그림 요소들 ── */
    .bg-deco { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }

    /* 큰 클로버 outline */
    .deco-clover-big {
      position: absolute;
      font-size: 9rem;
      opacity: 0.18;
      transform: rotate(-15deg);
      filter: blur(1px);
      color: var(--green);
    }

    /* 핑크 찢긴 종이 조각 */
    .torn-pink {
      position: absolute;
      background: #f9a8d4;
      opacity: 0.7;
      transform: rotate(-8deg);
      clip-path: polygon(0% 20%, 5% 0%, 95% 5%, 100% 25%, 98% 80%, 92% 100%, 8% 95%, 0% 75%);
    }

    /* 노란 반짝이 */
    .sparkle-deco {
      position: absolute;
      color: #f7d060;
      font-size: 1.8rem;
      animation: sparkleTwinkle var(--sd,2s) ease-in-out infinite var(--sl,0s);
    }
    @keyframes sparkleTwinkle {
      0%,100%{ opacity:1; transform:scale(1) rotate(0deg); }
      50%    { opacity:0.3; transform:scale(0.7) rotate(20deg); }
    }

    /* 잎사귀들 */
    .leaf {
      position: absolute;
      font-size: var(--ls, 2rem);
      opacity: 0.6;
      transform: rotate(var(--lr, 0deg));
      filter: saturate(0.7) brightness(0.85);
    }

    /* ── 메인 ── */
    .wrap {
      position: relative; z-index: 10;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center;
      padding: 28px 20px 80px;
      gap: 0;
    }

    /* ── 칠라씨 영역 ── */
    .chilla-area {
      position: relative;
      width: 100%;
      max-width: 360px;
      height: 300px;
      margin-bottom: -30px;
    }

    /* 뒤 클로버 SVG */
    .back-clover {
      position: absolute;
      top: -10px; right: 10px;
      width: 120px; opacity: 0.55;
      animation: gentleSway 4s ease-in-out infinite;
      transform-origin: bottom center;
    }
    @keyframes gentleSway {
      0%,100%{ transform: rotate(-3deg); }
      50%    { transform: rotate(3deg); }
    }

    /* 칠라씨 이미지 */
    .chilla-img {
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 240px;
      object-fit: contain;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.2));
      animation: chillaBreathe 3.5s ease-in-out infinite;
      transform-origin: bottom center;
      z-index: 3;
    }
    @keyframes chillaBreathe {
      0%,100%{ transform: translateX(-50%) scaleY(1) translateY(0); }
      50%    { transform: translateX(-50%) scaleY(1.025) translateY(-4px); }
    }

    /* 스티커 장식들 */
    .sticker {
      position: absolute;
      font-size: var(--ss, 1.6rem);
      transform: rotate(var(--sr, 0deg));
      animation: stickerPop var(--sp,3s) ease-in-out infinite var(--spd,0s);
      filter: drop-shadow(1px 2px 3px rgba(0,0,0,0.15));
      z-index: 4;
    }
    @keyframes stickerPop {
      0%,100%{ transform: rotate(var(--sr,0deg)) scale(1); }
      50%    { transform: rotate(var(--sr,0deg)) scale(1.12); }
    }

    /* ── 찢어진 종이 카드 ── */
    .torn-card {
      position: relative;
      width: min(92vw, 360px);
      background: var(--cream);
      padding: 28px 22px 22px;
      margin-bottom: 14px;
      filter: drop-shadow(3px 6px 16px rgba(0,0,0,0.18));
      /* 찢어진 위쪽 경계 */
      clip-path: polygon(
        0% 3%, 3% 0%, 6% 2.5%, 9% 0.5%, 12% 2%, 15% 0%, 18% 2.5%, 21% 0.5%,
        24% 2%, 27% 0%, 30% 2.5%, 33% 0.5%, 36% 2%, 39% 0%, 42% 2.5%,
        45% 0.5%, 48% 2%, 51% 0%, 54% 2.5%, 57% 0.5%, 60% 2%,
        63% 0%, 66% 2.5%, 69% 0.5%, 72% 2%, 75% 0%, 78% 2.5%,
        81% 0.5%, 84% 2%, 87% 0%, 90% 2.5%, 93% 0.5%, 96% 2%, 100% 0%,
        100% 100%, 0% 100%
      );
    }

    /* 종이 질감 선 */
    .torn-card::before {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 23px,
        rgba(180,160,120,0.1) 24px
      );
      pointer-events: none;
    }

    /* 테이프 장식 */
    .tape {
      position: absolute;
      height: 22px;
      background: rgba(210,180,120,0.45);
      border-top: 1px solid rgba(180,140,80,0.3);
      border-bottom: 1px solid rgba(180,140,80,0.3);
      transform: rotate(var(--tr, -3deg));
    }

    /* 배지 */
    .badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 2px;
      font-family: 'Gowun Dodum', cursive;
      font-size: 1rem; font-weight: 700;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
      transform: rotate(-1deg);
      box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
    }
    .badge.luck  { background: #fef08a; color: #713f12; }
    .badge.love  { background: #fce7f3; color: #9d174d; }
    .badge.happy { background: #dcfce7; color: #14532d; }

    /* 글귀 */
    .quote-area {
      text-align: center;
      min-height: 110px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .quote-area.changing { animation: pageTurn 0.35s ease both; }
    @keyframes pageTurn {
      0%  { opacity:1; transform:rotateY(0deg) translateX(0); }
      40% { opacity:0; transform:rotateY(6deg) translateX(8px); }
      60% { opacity:0; transform:rotateY(-3deg) translateX(-4px); }
      100%{ opacity:1; transform:rotateY(0deg) translateX(0); }
    }

    .quote-open {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 2.8rem; line-height: 0.8;
      color: var(--green); opacity: 0.4;
      margin-bottom: 4px;
    }
    .quote-text {
      font-family: 'Gowun Dodum', cursive;
      font-size: 1.2rem; font-weight: 700;
      line-height: 1.6;
      color: var(--ink);
      word-break: keep-all; white-space: pre-line;
      letter-spacing: -0.01em;
      margin-bottom: 10px;
    }
    .quote-sub {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 1rem;
      color: var(--brown);
      letter-spacing: 0.02em;
    }

    /* 점선 구분선 */
    .dot-line {
      width: 80%; margin: 12px auto 10px;
      border: none; border-top: 2px dashed rgba(100,140,80,0.3);
    }

    /* ── 버튼들 ── */
    .btn-wrap {
      display: flex; flex-direction: column;
      gap: 10px; width: min(92vw, 360px);
    }

    .collage-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px 20px;
      font-family: 'Gowun Dodum', cursive;
      font-size: 1.1rem; font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer; text-decoration: none;
      border: none; border-radius: 2px;
      position: relative;
      transform: rotate(var(--br, 0deg));
      transition: transform 0.1s, filter 0.1s;
      filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.15));
    }
    .collage-btn:hover {
      filter: drop-shadow(3px 6px 12px rgba(0,0,0,0.22)) brightness(1.03);
    }
    .collage-btn:active {
      transform: rotate(var(--br,0deg)) scale(0.97) translateY(2px);
      filter: drop-shadow(1px 2px 4px rgba(0,0,0,0.15));
    }

    /* 테이프 느낌 상단 장식 */
    .collage-btn::before {
      content: '';
      position: absolute;
      top: -8px; left: 50%; transform: translateX(-50%);
      width: 40px; height: 14px;
      background: rgba(210,180,120,0.55);
      border-radius: 2px;
    }

    .btn-new  { background: #dcfce7; color: var(--dark-green); --br: -0.8deg; }
    .btn-port { background: #fef9c3; color: #713f12;           --br:  0.6deg; }
    .btn-insta{ background: #fce7f3; color: #9d174d;           --br: -0.4deg; }

    /* 클릭 파티클 */
    .burst {
      position: fixed; pointer-events: none; z-index: 999;
      font-size: 1.2rem;
      animation: burstOut 1s ease-out forwards;
    }
    @keyframes burstOut {
      0%  { opacity:1; transform:translate(0,0) scale(1.3) rotate(0deg); }
      100%{ opacity:0; transform:translate(var(--tx),var(--ty)) scale(0.4) rotate(30deg); }
    }

    .footer {
      position: fixed; bottom: 14px; left:0; right:0;
      text-align: center;
      font-family: 'Gowun Dodum', cursive;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.04em;
      z-index: 20;
    }
  </style>
</head>

<!-- 배경 텍스처 -->
<div class="bg-texture"></div>

<!-- 배경 장식 -->
<div class="bg-deco">
  <!-- 큰 클로버 아웃라인 -->
  <div class="deco-clover-big" style="top:-20px;left:-20px;">🍀</div>
  <div class="deco-clover-big" style="top:10px;right:-30px;font-size:7rem;opacity:0.12;transform:rotate(20deg);">🍀</div>

  <!-- 핑크 찢긴 종이 -->
  <div class="torn-pink" style="width:80px;height:55px;top:38%;left:-10px;"></div>
  <div class="torn-pink" style="width:60px;height:40px;top:55%;right:-8px;transform:rotate(12deg);background:#fde68a;"></div>

  <!-- 반짝이 -->
  <div class="sparkle-deco" style="top:32%;left:6%;--sd:2.5s;--sl:0s;">✦</div>
  <div class="sparkle-deco" style="top:28%;left:10%;--sd:1.8s;--sl:0.4s;font-size:1.2rem;">✦</div>
  <div class="sparkle-deco" style="top:34%;right:8%;--sd:3s;--sl:0.8s;font-size:1.4rem;">✦</div>

  <!-- 잎사귀 -->
  <div class="leaf" style="bottom:14%;left:4%;--ls:2.5rem;--lr:20deg;">🌿</div>
  <div class="leaf" style="bottom:10%;right:6%;--ls:2rem;--lr:-25deg;">🍃</div>
  <div class="leaf" style="bottom:18%;right:12%;--ls:1.6rem;--lr:35deg;">🌱</div>
  <div class="leaf" style="top:60%;left:2%;--ls:1.8rem;--lr:-10deg;opacity:0.4;">🍂</div>
</div>

<!-- 메인 -->

  <!-- 칠라씨 -->

      <circle cx="72" cy="58" r="22" fill="none" stroke="#4a9e4a" stroke-width="4" opacity="0.6"/>
      <circle cx="50" cy="78" r="22" fill="none" stroke="#4a9e4a" stroke-width="4" opacity="0.6"/>
      <line x1="50" y1="78" x2="50" y2="108" stroke="#4a9e4a" stroke-width="4" opacity="0.6"/>
    </svg>

    <!-- 스티커들 -->
    <span class="sticker" style="top:20px;left:14px;--ss:1.8rem;--sr:-15deg;--sp:2.8s;--spd:0s;">⭐</span>
    <span class="sticker" style="top:60px;right:16px;--ss:1.4rem;--sr:10deg;--sp:3.2s;--spd:0.6s;">🌸</span>
    <span class="sticker" style="bottom:50px;left:20px;--ss:1.6rem;--sr:5deg;--sp:2.5s;--spd:1.2s;">💚</span>
